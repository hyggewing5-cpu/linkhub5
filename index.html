<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'self'; form-action 'self'; object-src 'none'">
<title>ศูนย์รวมลิงก์</title>
<script src="api-config.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>
:root{--ink:#10243b;--mut:#566679;--blue:#0b3a6e;--gold:#c8a43a;--card:rgba(255,255,255,.92);--line:rgba(16,36,59,.14);--tint:#e6eef8;--field:#fff}
[data-theme=dark]{--ink:#e8eef6;--mut:#a3b3c6;--blue:#8dbaf2;--card:rgba(15,26,42,.92);--line:rgba(255,255,255,.16);--tint:#1b2d47;--field:#12203a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:16px/1.55 'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--ink);background:#dbeafe}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px)}
.hero{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:4px solid var(--gold)}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.logo{width:76px;height:76px;flex:none;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:38px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;color:var(--blue)}
.hero p{margin:2px 0 0;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 12px;max-width:100%}
#q{width:300px}
button{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 16px;cursor:pointer}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
[data-theme=dark] button.pri{color:#0b1626}
button.sm{padding:3px 10px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.adm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0;padding:10px 14px;border-left:4px solid var(--gold)}
.adm b{margin-right:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:16px 0}
.tile{display:block;text-align:left;padding:14px 14px 14px 16px;border-radius:12px;border:1px solid var(--line);border-left:5px solid transparent;background:var(--card);backdrop-filter:blur(6px)}
.tile.on{border-left-color:var(--gold);background:var(--tint)}
.tile .ic{display:block;font-size:30px;line-height:1.2;height:36px}
.tile .ic img{height:34px;width:34px;object-fit:contain;border-radius:6px}
.tile b{display:block;margin-top:6px;font-size:15.5px;line-height:1.35}
.tile small{display:block;color:var(--mut);font-size:13px}
#panel{padding:6px 20px 14px}
.ph{display:flex;gap:12px;align-items:center;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.ph .ic{font-size:30px}.ph .ic img{height:34px;width:34px;object-fit:contain}
.ph h2{margin:0;font-size:20px;color:var(--blue);line-height:1.3}
.ph small{color:var(--mut)}
.ph .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.it{flex:1;min-width:0;display:flex;gap:14px;align-items:center;padding:12px 4px;color:inherit;text-decoration:none}
a.it:hover .tx b{text-decoration:underline;color:var(--blue)}
.it .ic{width:42px;height:42px;flex:none;border-radius:10px;background:var(--tint);display:grid;place-items:center;font-size:22px;overflow:hidden}
.it .ic img{width:100%;height:100%;object-fit:cover}
.tx b{display:block;font-weight:600}
.tx small{display:block;color:var(--mut);font-size:14px;white-space:pre-line}
.ed{display:flex;gap:6px;flex:none}
.empty{padding:28px 8px;color:var(--mut)}
footer{margin-top:18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;font-size:13px}
footer span{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--card);color:var(--mut)}
footer a{color:var(--blue)}
dialog{border:0;border-radius:14px;padding:22px;width:min(480px,94vw);background:var(--card);color:var(--ink);box-shadow:0 24px 70px rgba(10,25,45,.4)}
dialog::backdrop{background:rgba(10,25,45,.55)}
dialog h3{margin:0 0 12px;font-size:18px;color:var(--blue)}
dialog label{display:block;margin-bottom:12px;font-size:14px;color:var(--mut)}
dialog label input,dialog label select,dialog label textarea{display:block;width:100%;margin-top:4px;font-size:16px}
dialog label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
dialog label.chk input{width:auto;margin:0}
.ipt{display:flex;gap:6px;margin-top:4px}.ipt input{margin:0!important;flex:1;min-width:0}
.emo{display:flex;flex-wrap:wrap;gap:4px;margin:-6px 0 12px}.emo button{padding:2px 7px;font-size:20px;line-height:1.3}
.sw{display:flex;gap:8px;margin:4px 0 10px}
.sw button{width:42px;height:30px;padding:0;border-radius:8px}.sw button.on{outline:3px solid var(--gold);outline-offset:2px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
[data-theme=dark] #toast{color:#0b1626}
#toast.show{opacity:1}#toast.bad{background:#b4492f;color:#fff}
.nav{display:flex;gap:6px;margin:14px 0 0}
.nav button{border-radius:10px 10px 0 0;border-bottom:3px solid transparent;background:var(--card);padding:8px 18px}
.nav button.on{border-bottom-color:var(--gold);color:var(--blue);font-weight:600}
.banner{display:flex;gap:12px;align-items:center;margin:12px 0 0;padding:12px 16px;border-left:5px solid var(--gold)}
.banner .bi{font-size:28px}.banner img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.bt{flex:1;min-width:0}.bt b{display:block}.bt span{color:var(--mut);font-size:15px;white-space:pre-line}
a.btn{display:inline-block;text-decoration:none;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:15px}
a.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.post{display:flex;gap:14px;padding:14px 4px;color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.post:hover b{color:var(--blue);text-decoration:underline}
.pc{width:120px;height:80px;object-fit:cover;border-radius:8px;flex:none}
.pb{flex:1;min-width:0;display:block}.pb b{display:block;margin:2px 0;font-weight:600}.pb small{display:block;color:var(--mut)}
.pm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pm small{color:var(--mut)}
.pe{justify-content:flex-end;padding:6px 4px;border-bottom:1px solid var(--line)}
dialog.wide{width:min(720px,94vw);max-height:90vh;overflow:auto}
#pop{width:min(460px,94vw)}#pop img,.cv{width:100%;max-height:300px;object-fit:cover;border-radius:10px;margin-bottom:12px}
.pre{white-space:pre-line;line-height:1.75;margin:8px 0}
.mut{color:var(--mut);font-size:14px;margin:0 0 8px}
.dev{margin-left:auto;text-align:right;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);line-height:1.45}
.dev.add{border-style:dashed;cursor:pointer;color:var(--mut);font-size:13px}.dev small{display:block;color:var(--mut)}.dev b{display:block}
.dev span{display:block;padding:0;background:none;border-radius:0;color:var(--mut)}.dev a{color:var(--blue);font-weight:600}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;background:var(--tint);color:var(--ink);font-size:13px;font-weight:400;line-height:1.5;vertical-align:middle}
.chip.c{background:var(--gold);color:#10243b}
button.lnk{border:0;background:none;color:var(--blue);padding:0;text-decoration:underline;font-size:inherit}
.foot{margin:12px 0 0;font-size:14px;color:var(--mut)}
.pwshow{font-family:ui-monospace,Consolas,monospace;font-size:19px;user-select:all;letter-spacing:.5px}
.adm.note{border-left-color:var(--blue);margin:0 0 8px}
.hint{margin:6px 2px 0;color:var(--mut);font-size:13px}
.picker{border:1px solid var(--line);border-radius:10px;padding:8px;margin:0 0 12px}
.picker input[type=search]{width:100%;margin-bottom:6px}
.pk-list{max-height:210px;overflow:auto}
.pk-list label.chk{margin:0;padding:3px 2px;font-size:15px}
.pk-h{font-size:13px;color:var(--mut);margin:8px 0 2px;font-weight:600}
.via{color:var(--mut);font-size:13px}
.aclbox{margin:0 0 4px}
.prevbar{border-left-color:#b4492f}
@media(max-width:640px){.pc{width:84px;height:60px}.banner{flex-wrap:wrap}}
@media(max-width:640px){h1{font-size:21px}#q{width:100%}.hero{padding:16px}.logo{width:60px;height:60px;font-size:30px}#panel{padding:4px 12px 10px}.row{flex-wrap:wrap}.ed{padding:0 0 10px 56px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
 <header class="card hero">
  <div class="brand"><div class="logo" id="logo"></div><div><h1 id="sn">กำลังโหลด...</h1><p id="ss"></p></div></div>
  <input id="q" type="search" placeholder="ค้นหาระบบหรือลิงก์" aria-label="ค้นหาระบบหรือลิงก์">
 </header>
 <div class="nav" id="nav"></div>
 <div id="banners"></div>
 <div id="adm"></div>
 <nav class="tiles" id="tiles" aria-label="กลุ่มงาน"></nav>
 <section class="card" id="panel"></section>
 <section class="card" id="newsT" style="margin-top:16px"></section>
 <footer id="ft"></footer>
</div>
<dialog id="dlg"></dialog>
<dialog id="pop" aria-label="ประกาศ"></dialog>
<div id="toast" role="status"></div>

<script>

window.onerror = m => { const s = document.getElementById('ss'); if (s) s.textContent = 'เกิดข้อผิดพลาดในหน้าเว็บ: ' + m; };
const AUTO_LOGIN = /[?&]page=admin\b/.test(location.search) || /\/admin\/?$/.test(location.pathname);   // ลิงก์ ?page=admin หรือ /admin/ = เปิดหน้าเข้าสู่ระบบให้ทันที
const $ = s => document.querySelector(s);
const AM = String.fromCharCode(38), ESC = { '&': AM + 'amp;', '<': AM + 'lt;', '>': AM + 'gt;', '"': AM + 'quot;', "'": AM + '#39;' };
const esc = s => Array.from(String(s == null ? '' : s), c => ESC[c] || c).join('');
const PRE = {
 sky:'linear-gradient(160deg,#dbeafe,#f0f9ff 60%,#fef9e7)', navy:'linear-gradient(160deg,#0b2447,#19376d)',
 dawn:'linear-gradient(160deg,#fde68a,#fca5a5 55%,#a5b4fc)', mint:'linear-gradient(160deg,#d1fae5,#ecfeff)', sand:'#f3ede2'};
</script>
<script>
const EMO = ['\ud83d\udcbb','\ud83d\udda5\ufe0f','\ud83d\udee0\ufe0f','\ud83d\udcde','\ud83d\udc65','\ud83d\uddc2\ufe0f','\ud83d\udcc5','\ud83d\udcb0','\ud83d\udcda','\ud83d\udcd6','\u2b07\ufe0f','\ud83d\udcca','\ud83d\udcc8','\ud83d\uddc4\ufe0f','\ud83c\udfe5','\ud83d\udccd','\u260e\ufe0f','\u2709\ufe0f','\ud83d\udd12','\ud83e\uddfe','\ud83e\ude7a','\ud83d\udc8a','\ud83d\ude91','\ud83d\udee1\ufe0f'];
let S = null, TOK = '', ME = null, cur = '', view = 'home', PV = '', USERS_AT = 0;   // PV = ชื่อผู้ใช้ที่แอดมินกำลังดูในมุมมองของเขา
const PW_USER = 8, PW_ADMIN = 10;   // ต้องตรงกับ USER_PW_MIN / PW_MIN ใน Code.gs
try { TOK = sessionStorage.getItem('tk') || ''; } catch (e) {}

const CFG = window.LINKHUB_CONFIG || {};
const rpc = async (fn, ...a) => {   // เรียก Google Apps Script Web App (JSON ผ่าน POST แบบ text/plain เพื่อไม่ให้เกิด preflight)
  if (!CFG.API_URL || CFG.API_URL.includes('XXXX')) throw new Error('ยังไม่ได้ตั้งค่า API_URL ในไฟล์ api-config.js');
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), CFG.TIMEOUT_MS || 60000);
  let r;
  try { r = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify({ fn, args: a }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ac.signal, credentials: 'omit' }); }
  catch (e) { throw new Error(e && e.name === 'AbortError' ? 'เซิร์ฟเวอร์ตอบช้าเกินไป ลองใหม่อีกครั้ง' : 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ตและ API_URL แล้วลองใหม่'); }
  finally { clearTimeout(tm); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (ตรวจว่า Deploy เป็น Web app และ Who has access = Anyone)'); }
  if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j.data;
};
const th = i => i ? i.slice(8) + '/' + i.slice(5, 7) + '/' + (+i.slice(0, 4) + 543) : '-'; // วันที่แบบ วว/ดด/พ.ศ.
const isImg = v => String(v || '').trim().toLowerCase().startsWith('https://');
// แปลงลิงก์แชร์ของ Google Drive (\u2026/file/d/ID/view, open?id=ID, uc?id=ID) ให้เป็นลิงก์รูปที่แสดงได้
</script>
<script>
function fixImg(u) {
 u = String(u || '').trim();
 const l = u.toLowerCase();
 if (!l.includes('drive.google.com') && !l.includes('docs.google.com')) return u;
 let id = '';
 const i = u.indexOf('/d/');
 if (i >= 0) id = u.slice(i + 3).split('/')[0].split('?')[0];
 else { try { id = new URL(u).searchParams.get('id') || ''; } catch (e) {} }
 return id ? 'https://drive.google.com/thumbnail?id=' + id + '&sz=w1600' : u;
}
</script>
<script>
function imgFail(el) { // รูปโหลดไม่ได้: กลับไปใช้อีโมจิ และแจ้งแอดมินให้ตรวจสิทธิ์แชร์
 el.replaceWith(document.createTextNode(el.dataset.fb || '\ud83d\udd17'));
 if (canEdit()) toast('โหลดรูปไม่สำเร็จ: ไฟล์ต้องแชร์เป็น "ทุกคนที่มีลิงก์" และเป็นไฟล์รูปภาพ', 1);
}
const ico = (v, d) => isImg(v) ? `<img src="${esc(fixImg(v))}" alt="" data-fb="${esc(d)}" onerror="imgFail(this)" referrerpolicy="no-referrer">` : esc(v || d);
const canEdit = () => !!ME && ME.role === 'admin' && !PV;

function toast(m, bad) { const t = $('#toast'); t.textContent = m; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 3200); }
</script>
<script>
async function adm(fn, ...a) {
 try { S = await rpc(fn, TOK, ...a); render(); toast('บันทึกแล้ว'); return true; }
 catch (e) { const m = (e && e.message) || String(e); toast(m, 1); if (m.includes('หมดเวลา')) expired(); return false; }
}

/* ---------- ธีมและพื้นหลัง ---------- */
const isHexColor = v => v.length >= 4 && v.length <= 9 && v[0] === '#' && v.slice(1).split('').every(c => '0123456789abcdefABCDEF'.includes(c));
function applyTheme() {
 const s = S.settings; let b = s.background || 'preset:sky', css = PRE.sky;
 if (s.isDarkMode && b === 'preset:sky') b = 'preset:navy';
 if (b.startsWith('preset:')) css = PRE[b.slice(7)] || PRE.sky;
 else if (isHexColor(b.slice(6))) css = b.slice(6);
 else if (b.startsWith('img:')) css = 'center/cover url("' + fixImg(b.slice(4)).split('"').join('').split(String.fromCharCode(92)).join('') + '")';
 document.body.style.background = css; document.body.style.backgroundAttachment = 'fixed';
 document.documentElement.dataset.theme = s.isDarkMode ? 'dark' : 'light';
 document.title = s.siteName;
}

</script>
<script>
/* ---------- แสดงผล ---------- */
function groups() {
 const gs = S.groups.slice(), known = new Set(gs.map(g => g.id));
 if (S.links.some(l => !known.has(l.category))) gs.push({ id: '_other', name: 'อื่นๆ', sub: 'ยังไม่ได้จัดกลุ่ม', icon: '\ud83d\udcc1' });
 return gs;
}
const inGroup = (g, l) => g.id === '_other' ? !S.groups.some(x => x.id === l.category) : l.category === g.id;
const sorted = a => a.slice().sort((x, y) => x.order - y.order || x.name.localeCompare(y.name, 'th'));

</script>
<script>
function render() {
 applyTheme();
 const s = S.settings, gs = groups(), home = view === 'home';
 if (!gs.some(g => g.id === cur)) cur = gs[0] ? gs[0].id : '';
 $('#logo').innerHTML = isImg(s.profileImage) ? `<img src="${esc(fixImg(s.profileImage))}" alt="โลโก้หน่วยงาน" data-fb="\ud83c\udfe5" onerror="imgFail(this)" referrerpolicy="no-referrer">` : '\ud83c\udfe5';
 $('#sn').textContent = s.siteName; $('#ss').textContent = s.siteSub;
 if (view.slice(0, 2) === 'p:' && !pageList().some(p => 'p:' + p.id === view)) view = 'home';
 $('#nav').innerHTML = [['home', 'หน้าแรก'], ['news', 'ข่าวสาร/บทความ']].concat(pageList().map(p => ['p:' + p.id, (p.icon && !isImg(p.icon) ? p.icon + ' ' : '') + p.name + accTag(p.access) + (p.active ? '' : ' (ซ่อน)')]))
  .map(v => `<button class="${view === v[0] ? 'on' : ''}" onclick="setView(${esc(JSON.stringify(v[0]))})">${esc(v[1])}</button>`).join('');
 acctBar();
 banners();
 $('#tiles').style.display = home ? '' : 'none';
 $('#tiles').innerHTML = gs.map(g => `<button class="tile ${g.id === cur && !$('#q').value ? 'on' : ''}" onclick="pick(${esc(JSON.stringify(g.id))})"><span class="ic">${ico(g.icon, '\ud83d\udcc1')}</span><b>${esc(g.name)}${accTag(g.access)}</b><small>${esc(g.sub)}</small></button>`).join('');
 if (home) { panel(); newsTeaser(); } else { $('#newsT').style.display = 'none'; if (view === 'news') newsView(); else pageView(); }
 const tel = String(s.devPhone || '').split('').filter(c => '+0123456789'.includes(c)).join('');
 $('#ft').innerHTML = '<span>' + esc(s.siteName) + '</span>'
  + (s.devName || s.devRole || s.devPhone ? `<div class="dev"><small>ผู้พัฒนา</small>${s.devName ? '<b>' + esc(s.devName) + '</b>' : ''}${s.devRole ? '<span>' + esc(s.devRole) + '</span>' : ''}${s.devPhone ? `<a href="tel:${esc(tel)}">\ud83d\udcde ${esc(s.devPhone)}</a>` : ''}</div>` : (canEdit() ? '<button class="dev add" onclick="editSettings()">+ เพิ่มข้อมูลผู้พัฒนา (ชื่อ ตำแหน่ง เบอร์ติดต่อ)</button>' : ''));
}
</script>
<script>
function setView(v) { view = v; $('#q').value = ''; render(); }
function pick(id) { cur = id; view = 'home'; $('#q').value = ''; render(); }

function row(l) {
 const inner = `<span class="ic">${ico(l.image, '\ud83d\udd17')}</span><span class="tx"><b>${esc(l.name)} ${accChip(l.access, 'l', l.id)}</b><small>${esc(l.desc)}</small></span>`;
 const body = l.url ? `<a class="it" href="${esc(l.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="it">${inner}</div>`;
 return `<div class="row">${body}${canEdit() ? `<span class="ed"><button class="sm" onclick="editLink(${esc(JSON.stringify(l.id))})">แก้ไข</button><button class="sm" onclick="delLink(${esc(JSON.stringify(l.id))})">ลบ</button></span>` : ''}</div>`;
}
</script>
<script>
function panel() {
 const q = $('#q').value.trim().toLowerCase(), gs = groups();
 if (q) {
  const hit = sorted(S.links).filter(l => (l.name + ' ' + l.desc).toLowerCase().includes(q));

function uploadTo(cb) { // ย่อรูปในเบราว์เซอร์ก่อนอัปโหลด
 const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
 inp.onchange = () => {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
   const im = new Image();
   im.onload = async () => {
    const k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    try { toast('กำลังอัปโหลดรูป...'); cb(await rpc('uploadImage', TOK, c.toDataURL(f.type === 'image/png' ? 'image/png' : 'image/jpeg', .85))); toast('อัปโหลดรูปแล้ว'); }
    catch (e) { toast((e && e.message) || String(e), 1); }
   };
   im.src = r.result;
  };
  r.readAsDataURL(f);
 };
 inp.click();
}

/* ---------- แบนเนอร์ / ป๊อปอัป ---------- */

<script>
let popShown = false;
function showPopup() { // แสดงป๊อปอัปครั้งเดียวต่อการเข้าชม (ข้ามในโหมดแอดมิน)

 $('#pop').innerHTML = `${isImg(p.image) ? `<img src="${esc(fixImg(p.image))}" alt="" onerror="this.remove()" referrerpolicy="no-referrer">` : ''}<h3>${esc(p.title)}</h3><p class="pre">${esc(p.text)}</p><div class="acts">${p.url ? `<a class="btn pri" href="${esc(p.url)}" target="_blank" rel="noopener">ดูรายละเอียด</a>` : ''}<button onclick="$('#pop').close()">ปิด</button></div>`;

const pageList = () => ((S && S.pages) || []).slice().sort((a, b) => a.order - b.order || a.name.localeCompare(b.name, 'th'));
function pageView() {
 const p = pageList().find(x => 'p:' + x.id === view); if (!p) return;
 const q = $('#q').value.trim().toLowerCase();
 const ls = (p.links || []).filter(l => !q || (l.n + ' ' + l.u).toLowerCase().includes(q));
 $('#panel').innerHTML = `<div class="ph"><span class="ic">${ico(p.icon, '\ud83d\udcc4')}</span><div><h2>${esc(p.name)}</h2></div>${canEdit() ? `<span class="sp"><button class="sm" onclick="editPage(${esc(JSON.stringify(p.id))})">แก้ไขแท็บ</button><button class="sm" onclick="delPage(${esc(JSON.stringify(p.id))})">ลบแท็บ</button></span>` : ''}</div>`
  + (p.body ? `<div class="pre" style="padding:0 20px">${esc(p.body)}</div>` : '')
  + ls.map(l => `<div class="row"><div class="it"><span class="ic">\ud83d\udd17</span><span class="tx"><b>${esc(l.n)}</b></span></div><a class="btn" href="${esc(l.u)}" target="_blank" rel="noopener noreferrer">เปิด</a></div>`).join('')
  + (!p.body && !ls.length ? `<div class="empty">ยังไม่มีเนื้อหาในแท็บนี้${canEdit() ? ' กด "แก้ไขแท็บ" เพื่อเพิ่ม' : ''}</div>` : '');
}
function editPage(id) {
 const p = id ? S.pages.find(x => x.id === id) : { icon: '\ud83d\udcc4', active: true, order: pageList().length + 3, links: [] };
 const vals = { ...p, linkText: (p.links || []).map(l => l.n + ' | ' + l.u).join('\n') };
 form(id ? 'แก้ไขแท็บเมนู' : 'เพิ่มแท็บเมนู', [
  { k: 'name', l: 'ชื่อแท็บ (แสดงในแถบเมนู)', r: 1 }, { k: 'icon', l: 'ไอคอน', t: 'icon' },
  { k: 'body', l: 'เนื้อหา / คำอธิบาย (ไม่บังคับ)', t: 'area', rows: 6 },
  { k: 'linkText', l: 'รายการลิงก์ — บรรทัดละ 1 ลิงก์ รูปแบบ: ชื่อ | https://...', t: 'area', rows: 6 },
  { k: 'order', l: 'ลำดับในแถบเมนู (เลขน้อยอยู่ซ้าย)', t: 'number' }, ACC_FLD, { k: 'active', l: 'แสดงในเว็บ (ปิด = ซ่อนจากผู้เข้าชม)', t: 'chk' }
 ], vals, async o => {
  const links = o.linkText.split('\n').map(x => x.trim()).filter(Boolean).map(x => { const i = x.lastIndexOf('|'); return i < 0 ? { n: x, u: '' } : { n: x.slice(0, i).trim(), u: x.slice(i + 1).trim() }; });
  delete o.linkText;
  if (await adm('savePage', { ...o, links, id: id || '' }) && !id) { const n = pageList().find(x => x.name === o.name); if (n) view = 'p:' + n.id; render(); }
 }, o => o.linkText.split('\n').some(x => x.trim() && x.lastIndexOf('|') < 0) ? 'บางบรรทัดไม่มีเครื่องหมาย | คั่นระหว่างชื่อและลิงก์' : '');
}
function delPage(id) {

 form('ลบแท็บ "' + esc(p.name) + '" ?', [], {}, async () => { if (await adm('deletePage', id)) { view = 'home'; render(); } });
}

  { k: 'kind', l: 'รูปแบบ', t: 'sel', o: [['banner', 'แบนเนอร์ (แถบใต้หัวเว็บ)'], ['popup', 'ป๊อปอัป (หน้าต่างเมื่อเปิดเว็บ)']] },
  { k: 'title', l: 'หัวข้อ', r: 1 }, { k: 'text', l: 'ข้อความ', t: 'area' }, { k: 'image', l: 'รูปภาพ (ไม่บังคับ)', t: 'img' },

  { k: 'end', l: 'สิ้นสุด (เว้นว่าง = ไม่มีกำหนด)', t: 'date' }, { k: 'active', l: 'เปิดใช้งาน', t: 'chk' }

/* ---------- สิทธิ์การมองเห็น ---------- */
const ACC = [['public', 'ทุกคน (ไม่ต้องเข้าสู่ระบบ)'], ['member', 'เฉพาะสมาชิกที่เข้าสู่ระบบ'], ['admin', 'เฉพาะผู้ดูแลระบบ']];

 if (PV && S && S.preview) {

 el.innerHTML = `<div class="card adm"><b>${adm ? '🛡️ โหมดผู้ดูแลระบบ' : '👤 สมาชิก'} · ${esc(ME.name)}</b>${adm
  ? '<button class="pri" onclick="editSettings()">ตั้งค่าเว็บไซต์</button><button onclick="noticeMgr()">แบนเนอร์/ป๊อปอัป</button><button onclick="editGroup()">+ เพิ่มหัวข้อหน้าหลัก</button><button onclick="editPage()">+ เพิ่มแท็บเมนู</button><button onclick="userMgr()">จัดการสมาชิก</button><button onclick="teamMgr()">จัดการทีม</button><button onclick="logView()">ประวัติเข้าใช้</button><button onclick="regSettings()">ตั้งค่าการสมัคร</button>' : ''}<button onclick="pwDlg()">เปลี่ยนรหัสผ่าน</button><button onclick="logout()">ออกจากระบบ</button></div>`
  + (adm ? '<p class="hint">👥 = เห็นเฉพาะสมาชิก &nbsp; 🎯 = เฉพาะทีม/รายคนที่กำหนด &nbsp; 🔒 = เห็นเฉพาะผู้ดูแลระบบ (ตั้งได้ในฟอร์มแก้ไขของแต่ละรายการ/กลุ่ม; ข่าวและแท็บเลือกได้ 3 แบบแรก)</p>' : '');
}

/* ---------- แอดมิน: ตั้งค่าการสมัคร ---------- */
function regSettings() {
 const r = (S && S.reg) || { open: true, code: '' };
 form('ตั้งค่าการสมัครสมาชิก', [{ k: 'open', l: 'เปิดรับสมัครสมาชิก', t: 'chk' }, { k: 'code', l: 'รหัสสมัครของหน่วย (เว้นว่าง = ไม่ต้องใช้รหัส)', max: 40 }], r, async o => {

 }, null, { note: 'แนะนำให้ตั้งรหัสสมัครและแจ้งเฉพาะบุคลากรในหน่วย เพื่อไม่ให้คนภายนอกที่รู้ลิงก์เว็บสมัครเข้ามาได้ (ผู้ที่สมัครไปแล้วไม่ได้รับผลกระทบ)' });

/* ---------- แอดมิน: จัดการสมาชิก ---------- */
let USERS = [];
function uerr(e) { const m = errMsg(e); toast(m, 1); if (m.includes('หมดเวลา')) { dlg.close(); expired(); } }
function userMgr() {
 if (dlg.open) dlg.close();
 dlg.className = 'wide';
 dlg.innerHTML = `<h3>จัดการสมาชิก</h3><p class="mut" id="ucnt">กำลังโหลด...</p><input id="uq" type="search" placeholder="ค้นหาชื่อ / ชื่อผู้ใช้ / สังกัด" style="width:100%;margin-bottom:8px" aria-label="ค้นหาสมาชิก"><div id="umsg"></div><div id="ul"></div><div class="acts"><button class="pri" data-x="1">ปิด</button></div>`;
 dlg.showModal();
 $('#uq').oninput = fillUsers;
 rpc('listUsers', TOK).then(l => { USERS = l; fillUsers(); }).catch(uerr);
}
function fillUsers() {
 if (!$('#ul')) return;
 const q = ($('#uq').value || '').trim().toLowerCase();
 const l = USERS.filter(u => !q || (u.username + ' ' + u.name + ' ' + u.unit).toLowerCase().includes(q));
 $('#ucnt').textContent = 'สมาชิกทั้งหมด ' + USERS.length + ' คน (ผู้ดูแล ' + USERS.filter(u => u.role === 'admin').length + ' คน)';
 $('#ul').innerHTML = l.map(u => {
  const id = esc(JSON.stringify(u.id)), self = ME && ME.username === u.username;
  return `<div class="row"><div class="it"><span class="ic">${u.role === 'admin' ? '🛡️' : '👤'}</span><span class="tx"><b>${esc(u.name)} <small>(${esc(u.username)})</small></b><small>${esc(u.unit || '-')} | ${u.role === 'admin' ? 'ผู้ดูแล' : 'ผู้ใช้'}${u.active ? '' : ' | ระงับ'} | เข้าล่าสุด ${esc(u.last || '-')} | ${u.count} ครั้ง</small></span></div>`
   + `<span class="ed">${self ? '' : `<button class="sm" onclick="uAct(${id},{role:'${u.role === 'admin' ? 'user' : 'admin'}'})">${u.role === 'admin' ? 'ลดเป็นผู้ใช้' : 'ตั้งเป็นผู้ดูแล'}</button><button class="sm" onclick="uAct(${id},{active:${!u.active}})">${u.active ? 'ระงับ' : 'เปิดใช้'}</button>`}<button class="sm" onclick="userAcc(${id})">สิทธิ์เข้าถึง</button><button class="sm" onclick="uReset(${id})">รีเซ็ตรหัส</button>${self ? '' : `<button class="sm" onclick="uDel(${id})">ลบ</button>`}</span></div>`;
 }).join('') || '<div class="empty">ไม่พบสมาชิก</div>';
}
async function uAct(id, p) { try { USERS = await rpc('updateUser', TOK, id, p); fillUsers(); toast('บันทึกแล้ว'); } catch (e) { uerr(e); } }
async function uReset(id) {
 const u = USERS.find(x => x.id === id); if (!u) return;
 if (!confirm('รีเซ็ตรหัสผ่านของ "' + u.name + '" ?\nระบบจะสร้างรหัสชั่วคราวใหม่ และสมาชิกจะถูกออกจากระบบทุกเครื่อง')) return;
 try { const r = await rpc('resetUserPassword', TOK, id); $('#umsg').innerHTML = `<div class="card adm note"><span>รหัสผ่านชั่วคราวของ <b>${esc(r.username)}</b>: <b class="pwshow">${esc(r.pw)}</b><br><small>แสดงครั้งเดียว — แจ้งสมาชิกแล้วให้เปลี่ยนรหัสหลังเข้าสู่ระบบ</small></span></div>`; }
 catch (e) { uerr(e); }
}
async function uDel(id) {
 const u = USERS.find(x => x.id === id); if (!u) return;
 if (!confirm('ลบสมาชิก "' + u.name + '" (' + u.username + ') ?\nประวัติการเข้าใช้เดิมยังคงอยู่')) return;
 try { USERS = await rpc('deleteUser', TOK, id); fillUsers(); toast('ลบแล้ว'); } catch (e) { uerr(e); }
}

/* ---------- แอดมิน: ประวัติเข้าใช้ ---------- */
function logView() {
 if (dlg.open) dlg.close();
 dlg.className = 'wide';
 dlg.innerHTML = `<h3>ประวัติการเข้าใช้งาน</h3><p class="mut" id="lcnt">กำลังโหลด...</p><input id="lq" type="search" placeholder="ค้นหาชื่อผู้ใช้ / ชื่อ / เหตุการณ์" style="width:100%;margin-bottom:8px" aria-label="ค้นหาประวัติ"><div id="ll"></div><div class="acts"><button onclick="logCsv()">ดาวน์โหลด CSV</button><button class="pri" data-x="1">ปิด</button></div>`;
 dlg.showModal();
 $('#lq').oninput = () => { clearTimeout(logView.t); logView.t = setTimeout(loadLogs, 300); };
 loadLogs();
}
async function loadLogs() {
 if (!$('#lq')) return;
 const q = $('#lq').value.trim();
 let l; try { l = await rpc('getLoginLog', TOK, q, 500); } catch (e) { return uerr(e); }
 if (!$('#lq')) return;
 $('#lcnt').textContent = 'แสดง ' + l.length + ' รายการล่าสุด' + (q ? ' (ตามคำค้น)' : '') + ' — ระบบเก็บประวัติสูงสุดราว 20,000 รายการ';
 $('#ll').innerHTML = l.map(r => `<div class="row"><div class="it"><span class="tx"><b>${esc(r.n || r.u)} <small>(${esc(r.u)})</small> — ${esc(r.e)}</b><small>${esc(r.t)}${r.d ? ' | ' + esc(r.d) : ''}</small></span></div></div>`).join('') || '<div class="empty">ไม่พบประวัติ</div>';
}
async function logCsv() {
 try {
  const rows = await rpc('getLoginLog', TOK, $('#lq') ? $('#lq').value.trim() : '', 5000);
  const cell = v => { v = String(v == null ? '' : v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.split('"').join('""') + '"'; };
  const csv = '﻿' + [['เวลา', 'ชื่อผู้ใช้', 'ชื่อ-สกุล', 'เหตุการณ์', 'รายละเอียด']].concat(rows.map(r => [r.t, r.u, r.n, r.e, r.d])).map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'login-history-' + today() + '.csv';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
 } catch (e) { uerr(e); }
}

/* ---------- ทีม / สิทธิ์เฉพาะ (แอดมิน) ---------- */
async function needUsers() {       // โหลดรายชื่อสมาชิก (ใช้ซ้ำได้ 2 นาที)
 if (USERS.length && Date.now() - USERS_AT < 120000) return true;
 try { USERS = await rpc('listUsers', TOK); USERS_AT = Date.now(); return true; } catch (e) { uerr(e); return false; }
}
/** กล่องเลือกทีม/รายคน: o = {teams, selT, users, selU, showTeams} */
function pickerHtml(o) {
 const t = o.showTeams ? '<div class="pk-h">ทีม</div>' + (o.teams.map(x => `<label class="chk" data-s="${esc(x.name.toLowerCase())}"><input type="checkbox" data-pt="${esc(x.id)}"${o.selT.indexOf(x.id) >= 0 ? ' checked' : ''}> 👥 ${esc(x.name)} <small class="via">(${x.members.length} คน)</small></label>`).join('') || '<div class="mut">ยังไม่มีทีม — สร้างได้ที่ปุ่ม "จัดการทีม"</div>') : '';
 const u = '<div class="pk-h">รายคน</div>' + (o.users.map(x => `<label class="chk" data-s="${esc((x.username + ' ' + x.name + ' ' + (x.unit || '')).toLowerCase())}"><input type="checkbox" data-pu="${esc(x.username)}"${o.selU.indexOf(x.username) >= 0 ? ' checked' : ''}> 👤 ${esc(x.name)} <small class="via">(${esc(x.username)}${x.unit ? ' · ' + esc(x.unit) : ''})</small></label>`).join('') || '<div class="mut">ยังไม่มีสมาชิก</div>');
 return `<div class="picker"><input type="search" data-pq="1" placeholder="ค้นหาชื่อ / ชื่อผู้ใช้ / สังกัด" aria-label="ค้นหา"><div class="pk-list">${t}${u}</div></div>`;
}
function collectPicker(root) {
 const get = a => Array.from(root.querySelectorAll('[' + a + ']:checked')).map(x => x.getAttribute(a));
 return { teams: get('data-pt'), users: get('data-pu') };
}
function aclField(vals) {
 const a = vals.acl || { teams: [], users: [] };
 return `<div class="aclbox"${vals.access === 'custom' ? '' : ' hidden'}><p class="mut">เลือกทีมและ/หรือรายคนที่จะเห็นรายการนี้ (ผู้ดูแลเห็นเสมอ) — ถ้าไม่เลือกใครเลย จะมีเพียงผู้ดูแลที่เห็น</p>${pickerHtml({ teams: S.teams || [], selT: a.teams, users: USERS, selU: a.users, showTeams: true })}</div>`;
}

function teamMgr() {
 if (dlg.open) dlg.close();
 dlg.className = 'wide';
 const ts = S.teams || [];
 dlg.innerHTML = '<h3>จัดการทีม</h3><p class="mut">ทีมใช้รวมสมาชิกเป็นกลุ่ม เพื่อกำหนดสิทธิ์ดูรายการแบบ "เฉพาะทีม / รายคนที่กำหนด" ได้ทีเดียวทั้งทีม</p>'
  + (ts.map(t => `<div class="row"><div class="it"><span class="ic">👥</span><span class="tx"><b>${esc(t.name)}</b><small>${t.members.length} คน${t.desc ? ' | ' + esc(t.desc) : ''}</small></span></div><span class="ed"><button class="sm" data-tedit="${esc(t.id)}">แก้ไข</button><button class="sm" data-tdel="${esc(t.id)}">ลบ</button></span></div>`).join('') || '<div class="empty">ยังไม่มีทีม กด "+ สร้างทีม" เพื่อเริ่มต้น</div>')
  + '<div class="acts"><button data-x="1">ปิด</button><button class="pri" data-tnew="1">+ สร้างทีม</button></div>';
 dlg.showModal();
}
async function teamEdit(id) {
 if (!(await needUsers())) return;
 const t = id ? (S.teams || []).find(x => x.id === id) : { name: '', desc: '', members: [] };
 if (!t) return;
 if (dlg.open) dlg.close();
 dlg.className = 'wide';
 dlg.innerHTML = `<form><h3>${id ? 'แก้ไขทีม' : 'สร้างทีม'}</h3><label>ชื่อทีม<input name="tname" required maxlength="60" value="${esc(t.name)}"></label><label>คำอธิบาย (ไม่บังคับ)<input name="tdesc" maxlength="200" value="${esc(t.desc)}"></label><div class="pk-h">สมาชิกในทีม</div>${pickerHtml({ teams: [], selT: [], users: USERS, selU: t.members, showTeams: false })}<div class="acts"><button type="button" data-tback="1">ยกเลิก</button><button class="pri">บันทึก</button></div></form>`;
 dlg.querySelector('form').onsubmit = async e => {
  e.preventDefault();
  const sel = collectPicker(dlg), v = { id: id || '', name: dlg.querySelector('[name=tname]').value.trim(), desc: dlg.querySelector('[name=tdesc]').value.trim(), members: sel.users };
  dlg.close();
  if (await adm('saveTeam', v)) teamMgr(); else teamMgr();
 };
 dlg.showModal();
}
async function teamDel(id) {
 const t = (S.teams || []).find(x => x.id === id); if (!t) return;
 if (!confirm('ลบทีม "' + t.name + '" ?\nสมาชิกที่ได้สิทธิ์ผ่านทีมนี้จะเสียสิทธิ์ทันที (ผู้ใช้และรายการไม่ถูกลบ)')) return;
 await adm('deleteTeam', id); teamMgr();
}

/** ตั้งสิทธิ์รายบุคคล: เลือกทีมที่สังกัด + รายการ "เฉพาะที่กำหนด" ที่ให้เห็นโดยตรง */
function userAcc(id) {
 const u = USERS.find(x => x.id === id); if (!u) return;
 const teams = S.teams || [], acl = S.acl || { g: {}, l: {} }, mine = teams.filter(t => t.members.indexOf(u.username) >= 0).map(t => t.id);
 const items = [];
 S.groups.filter(g => g.access === 'custom').forEach(g => items.push({ key: 'g:' + g.id, label: '📁 กลุ่ม: ' + g.name, e: acl.g[g.id] || { teams: [], users: [] } }));
 S.links.filter(l => l.access === 'custom').forEach(l => items.push({ key: 'l:' + l.id, label: '🔗 ' + l.name, e: acl.l[l.id] || { teams: [], users: [] } }));
 if (dlg.open) dlg.close();
 dlg.className = 'wide';
 dlg.innerHTML = `<h3>สิทธิ์เข้าถึงของ ${esc(u.name)} <small>(${esc(u.username)})</small></h3>`
  + '<p class="mut">สมาชิกเห็นรายการ "ทุกคน" และ "เฉพาะสมาชิก" อยู่แล้ว ส่วนนี้ใช้กำหนดเพิ่มสำหรับรายการแบบ "เฉพาะทีม / รายคนที่กำหนด" เท่านั้น</p>'
  + '<div class="pk-h">ทีมที่สังกัด</div>' + (teams.map(t => `<label class="chk"><input type="checkbox" data-at="${esc(t.id)}"${mine.indexOf(t.id) >= 0 ? ' checked' : ''}> 👥 ${esc(t.name)}</label>`).join('') || '<div class="mut">ยังไม่มีทีม — สร้างได้ที่ปุ่ม "จัดการทีม"</div>')
  + '<div class="pk-h">รายการแบบเฉพาะที่กำหนด — ให้สมาชิกคนนี้เห็น</div>'
  + (items.map(x => `<label class="chk" data-via="${esc(x.e.teams.join(','))}"><input type="checkbox" data-ai="${esc(x.key)}"${x.e.users.indexOf(u.username) >= 0 ? ' checked' : ''}> ${esc(x.label)} <span class="via"></span></label>`).join('') || '<div class="mut">ยังไม่มีรายการที่ตั้งเป็น "เฉพาะทีม / รายคนที่กำหนด" — ตั้งได้ที่ฟอร์มแก้ไขของกลุ่มหรือลิงก์</div>')
  + `<div class="acts"><button data-x="1">ปิด</button><button data-prev="${esc(u.username)}">ดูในมุมมองผู้ใช้นี้</button><button class="pri" data-asave="${esc(u.id)}">บันทึก</button></div>`;
 dlg.showModal();
 updVia();
}
function updVia() {       // แสดง "(ได้ผ่านทีม ...)" ตามทีมที่ติ๊กอยู่ตอนนี้
 const on = Array.from(dlg.querySelectorAll('[data-at]:checked')).map(x => x.dataset.at), names = {};
 (S.teams || []).forEach(t => { names[t.id] = t.name; });
 dlg.querySelectorAll('label[data-via]').forEach(l => {
  const via = l.dataset.via.split(',').filter(x => x && on.indexOf(x) >= 0).map(x => names[x]);
  l.querySelector('.via').textContent = via.length ? '(ได้ผ่านทีม ' + via.join(', ') + ' อยู่แล้ว)' : '';
 });
}
async function userAccSave(id) {
 const u = USERS.find(x => x.id === id); if (!u) return;
 const on = a => Array.from(dlg.querySelectorAll('[' + a + ']:checked')).map(x => x.getAttribute(a));
 const items = on('data-ai'), p = { teams: on('data-at'), groups: items.filter(x => x.indexOf('g:') === 0).map(x => x.slice(2)), links: items.filter(x => x.indexOf('l:') === 0).map(x => x.slice(2)) };
 dlg.close();
 await adm('saveUserAccess', u.username, p);
 userMgr();
}
async function startPreview(username) { PV = username; view = 'home'; cur = ''; await reload(); window.scrollTo({ top: 0 }); }
async function endPreview() { PV = ''; view = 'home'; cur = ''; await reload('กลับสู่มุมมองผู้ดูแลแล้ว'); }

/* ---------- เริ่มทำงาน ---------- */
(async () => {
 try { S = await rpc('getData', TOK); }
 catch (e) { $('#sn').textContent = 'โหลดข้อมูลไม่สำเร็จ'; $('#ss').textContent = errMsg(e); return; }
 if (S.expired) { clearSession(); toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่', 1); }
 ME = S.me || null;
 render(); showPopup();
 if (AUTO_LOGIN && !ME) loginDlg();
})();

</script>
